name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/clarenous/test-cla-assistant/blob/main/CLA.md"
          branch: "dev"
          allowlist: dependabot[bot],github-actions[bot],clarenous
          create-file-commit-message: "Created file for storing CLA Signatures"
          signed-commit-message: "CLA signed by contributor ($contributorName)"
          lock-pullrequest-aftermerge: true
          suggest-recheck: true
